<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${brief.headline()}">Daily Brief</title>
    <style>
        :root {
            --bg: #fbfbfa; --surface: #ffffff; --text: #1a1a18; --muted: #6b6b66;
            --line: #e5e5e0; --accent: #b8563a;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17171a; --surface: #1f1f23; --text: #ececea; --muted: #9a9a95;
                --line: #32323a; --accent: #e08a6b;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 2.5rem 1.25rem; background: var(--bg); color: var(--text);
            font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { max-width: 44rem; margin: 0 auto; }
        .eyebrow {
            font-size: .75rem; letter-spacing: .12em; text-transform: uppercase;
            color: var(--accent); font-weight: 600; margin: 0 0 .5rem;
        }
        h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.2; margin: 0 0 1rem; }
        .overview { font-size: 1.075rem; color: var(--text); margin: 0 0 2rem; }
        article {
            background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
            padding: 1.15rem 1.35rem; margin-bottom: 1rem;
        }
        article h2 { font-size: 1.075rem; margin: 0 0 .4rem; }
        article p { margin: 0; color: var(--text); }
        .category {
            display: inline-block; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
            color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
            padding: .12rem .55rem; margin-bottom: .55rem;
        }
        footer {
            margin-top: 2.5rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
            font-size: .85rem; color: var(--muted);
        }
        footer a { color: inherit; }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">Daily Brief</p>
    <h1 th:text="${brief.headline()}">Headline</h1>
    <p class="overview" th:text="${brief.overview()}">Overview of the day.</p>

    <article th:each="topic : ${brief.topics()}">
        <span class="category" th:if="${topic.category()}" th:text="${topic.category()}">category</span>
        <h2 th:text="${topic.title()}">Topic title</h2>
        <p th:text="${topic.summary()}">Topic summary.</p>
    </article>

    <footer>
        <p>
            Summarized from
            <span th:text="${brief.sources().articleCount()}">0</span> headlines
            (<span th:text="${brief.sources().country()}">us</span><span
                th:if="${brief.sources().category()}"
                th:text="' / ' + ${brief.sources().category()}"></span>)
            &middot; generated <span th:text="${brief.generatedAt()}">now</span>
        </p>
        <p>Source data from NewsAPI. Summary written by a local language model &mdash; verify before relying on it.</p>
    </footer>
</main>
</body>
</html>
